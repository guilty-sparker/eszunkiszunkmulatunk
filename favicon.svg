<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0d0a5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d07a45;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a87449;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Outer ring -->
  <circle cx="50" cy="50" r="35" fill="none" stroke="url(#ringGradient)" stroke-width="4" opacity="0.9"/>
  <!-- Inner ring -->
  <circle cx="50" cy="50" r="25" fill="none" stroke="url(#ringGradient)" stroke-width="3" opacity="0.7"/>
  <!-- Gem/center -->
  <circle cx="50" cy="50" r="8" fill="url(#ringGradient)" opacity="0.8"/>
</svg>
